name: Lean proof
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Check final theorem axioms
        run: lake env lean AxiomAudit.lean
      - name: Check standalone Big O candidate and axioms
        run: lake env lean -DautoImplicit=false Submission.lean
